name: CinemaX Player Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0"

      - name: Set up Gradle 9.9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Ensure debug keystore exists for CI signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=CinemaX,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          else
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload ARM64 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CinemaX-Player-Debug-APK-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ARMv7 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CinemaX-Player-Debug-APK-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CinemaX-Player-Debug-APK-x86_64
          path: app/build/outputs/apk/debug/*x86_64*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86 Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: CinemaX-Player-Debug-APK-x86
          path: app/build/outputs/apk/debug/*x86*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CinemaX-Player-Unit-Test-Reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  publish-release:
    name: Publish APKs to GitHub Releases
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download ABI APK artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: CinemaX-Player-Debug-APK-*
          path: release-assets
          merge-multiple: true

      - name: Validate APKs and publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apk_files < <(find release-assets -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#apk_files[@]}" -ne 4 ]]; then
            echo "::error::Expected exactly 4 ABI APK files, found ${#apk_files[@]}."
            printf '%s\\n' "${apk_files[@]}"
            exit 1
          fi

          for apk in "${apk_files[@]}"; do
            if [[ ! -s "$apk" ]]; then
              echo "::error::APK is missing or empty: $apk"
              exit 1
            fi
          done

          version_name="$(awk -F '"' '/^[[:space:]]*versionName[[:space:]]*=/ { print $2; exit }' app/build.gradle.kts)"
          if [[ -z "$version_name" ]]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi

          tag="v${version_name}-build.${GITHUB_RUN_NUMBER}"
          title="CinemaX Player ${version_name} - Build ${GITHUB_RUN_NUMBER}"

          (
            cd release-assets
            sha256sum *.apk > SHA256SUMS.txt
          )

          cat > release-notes.md <<EOF
          ## CinemaX Player ${version_name}

          This release was published automatically after the Android CI tests and APK build completed successfully.

          - **App version:** ${version_name}
          - **Build number:** ${GITHUB_RUN_NUMBER}
          - **Source commit:** ${GITHUB_SHA}
          - **Architectures:** ARM64-v8a, ARMv7, x86_64, x86
          - **Build type:** Debug
          - **Signing:** CI-generated Android debug key; this is not a production-signed release.

          Download the APK that matches your device architecture. Verify downloaded files with the SHA256SUMS.txt file.
          EOF

          gh release create "$tag" "${apk_files[@]}" release-assets/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "$title"             --notes-file release-notes.md             --latest

